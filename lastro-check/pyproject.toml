[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastro-check"
version = "0.1.2"
description = "Receivables reconciliation, document inventory and offline commercial licensing toolkit"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.scripts]
lastro = "lastro.cli:main"

[tool.setuptools.packages.find]
include = ["lastro*"]
