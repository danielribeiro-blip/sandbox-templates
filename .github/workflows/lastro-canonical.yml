name: Lastro canonical integration
on:
  push:
    branches: ['lastro/canonical-integration-v012']
  pull_request:
    paths: ['lastro-check/**', '.github/workflows/lastro-canonical.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lastro-check
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pytest setuptools wheel
      - run: python -m pytest -q
      - run: python scripts/build_distribution.py --out ../canonical-release
      - name: Install wheel and run outside source tree
        run: |
          python -m pip uninstall -y lastro-check
          python -m pip install --no-deps ../canonical-release/*.whl
          cd ..
          python lastro-check/scripts/smoke_installed.py --examples lastro-check/examples --distribution canonical-release/lastro-commercial-v0.1.2.zip --out canonical-demo
      - uses: actions/upload-artifact@v4
        with:
          name: lastro-canonical-${{ matrix.os }}
          path: |
            canonical-release
            canonical-demo
